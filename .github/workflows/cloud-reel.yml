name: Cloud reel (agent-triggered)

# Agent cloud me video banata hai — owner ka koi click nahi.
# Trigger: cloud/jobs/<id>.json ka push (agent queue me job daalta hai) ya manual dispatch.
# Result: cloud-artifacts branch par mp4 + receipt (git se hi wapas aata hai).

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "job id (cloud/jobs/<id>.json)"
        required: false
        default: ""
  push:
    paths:
      - "cloud/jobs/*.json"

permissions:
  contents: write
  actions: read

concurrency:
  group: cloud-reel
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ffmpeg + pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet pillow
          ffmpeg -hide_banner -version | head -2

      - name: Pick the job
        id: pick
        run: |
          set -euo pipefail
          JOB="${{ github.event.inputs.job_id }}"
          if [ -z "$JOB" ]; then
            JOB=$(ls -t cloud/jobs/*.json 2>/dev/null | head -1 | xargs -r basename | sed 's/\.json$//')
          fi
          if [ -z "$JOB" ]; then
            echo "koi job nahi mila (cloud/jobs/*.json khali hai)"; exit 1
          fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "job: $JOB"
          cat "cloud/jobs/$JOB.json"

      - name: Render in the cloud
        id: render
        run: |
          set -euo pipefail
          JOB="${{ steps.pick.outputs.job }}"
          SPEC=$(python3 -c "import json,sys;print(json.load(open('cloud/jobs/$JOB.json'))['spec'])")
          OUTDIR="cloud_out/$JOB"
          mkdir -p "$OUTDIR"
          python3 tools/reel_render.py "$SPEC" --out "$OUTDIR/${JOB}_MASTER.mp4" | tee "$OUTDIR/render.log"
          echo "spec=$SPEC" >> "$GITHUB_OUTPUT"

      - name: Receipt + payload
        run: |
          set -euo pipefail
          JOB="${{ steps.pick.outputs.job }}"
          OUTDIR="cloud_out/$JOB"
          python3 - "$JOB" "$OUTDIR" <<'PY'
          import json, pathlib, sys, hashlib, subprocess
          job_id, outdir = sys.argv[1], pathlib.Path(sys.argv[2])
          master = outdir / f"{job_id}_MASTER.mp4"
          digest = hashlib.md5(master.read_bytes()).hexdigest()
          probe = subprocess.run(["ffmpeg", "-hide_banner", "-i", str(master)],
                                 capture_output=True, text=True).stderr
          payload = {"job": job_id, "runner": "github-actions",
                     "master": master.name, "bytes": master.stat().st_size,
                     "md5": digest, "probe_tail": probe.strip().splitlines()[-6:],
                     "made_at": subprocess.run(["date", "-u", "+%Y-%m-%dT%H:%M:%SZ"],
                                               capture_output=True, text=True).stdout.strip()}
          (outdir / "cloud_receipt.json").write_text(json.dumps(payload, indent=2))
          print(json.dumps(payload, indent=2))
          PY

      - name: Publish to cloud-artifacts branch (git only, no LFS)
        run: |
          set -euo pipefail
          JOB="${{ steps.pick.outputs.job }}"
          OUTDIR="cloud_out/$JOB"
          git config user.name "Monarch Cloud"
          git config user.email "cloud@monarch.local"
          rm -rf /tmp/artifacts && mkdir -p /tmp/artifacts
          cp "$OUTDIR/${JOB}_MASTER.mp4" "$OUTDIR/cloud_receipt.json" /tmp/artifacts/
          cp "$OUTDIR/render.log" /tmp/artifacts/ || true
          git checkout --orphan cloud-artifacts-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf ./* ./.github 2>/dev/null || true
          cp -r /tmp/artifacts/* .
          git add -A
          git commit -q -m "cloud artifact: $JOB (${{ github.sha }})"
          git push --force origin HEAD:cloud-artifacts
          echo "published to cloud-artifacts branch"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-master
          path: cloud_out/**/*
          retention-days: 7
