name: probe2
on:
  workflow_dispatch:
    inputs:
      chunks:
        description: "semicolon se alag"
        required: false
        default: "a;b"
permissions:
  contents: write
concurrency:
  group: probe2
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      POLL_MAX: "70"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inputs
        run: |
          echo "CHUNKS=${{ github.event.inputs.chunks }}" >> "$GITHUB_ENV"
      - name: Run
        run: bash scripts/kaggle_chunks.sh "$CHUNKS" clips
