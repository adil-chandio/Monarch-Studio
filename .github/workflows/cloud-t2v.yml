name: Cloud T2V scenes (agent-triggered, parallel)

# Har scene ka apna parallel job. Har backend sach me frames generate karta hai (slideshow nahi):
#   wan         = Wan 2.1 T2V-1.3B (2025)   -> realism
#   ltx         = LTX-Video 2B              -> 24 fps motion
#   animatediff = SD1.5 + motion adapter    -> sasta fallback
# Har scene apni branch par publish hoti hai: t2v-<job>-<scene>

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        default: "quality-lab"
      only:
        required: false
        default: ""
  push:
    paths:
      - "cloud/t2v_jobs/*.json"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      job_id: ${{ steps.list.outputs.job_id }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |-
          set -euo pipefail
          JOB="${{ github.event.inputs.job_id }}"
          if [ -z "$JOB" ]; then
            # push trigger: is commit me jo job file badli hai wohi chalao
            JOB=$(git show --name-only --pretty=format: "$GITHUB_SHA" \
                  | grep -E '^cloud/t2v_jobs/.*\.json$' | head -1 | xargs -r basename | sed 's/\.json$//' || true)
          fi
          if [ -z "$JOB" ]; then JOB="quality-lab"; fi
          ONLY="${{ github.event.inputs.only }}"
          python3 - "$JOB" "$ONLY" <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, sys
          job_id, only = sys.argv[1], sys.argv[2]
          data = json.loads(pathlib.Path(f"cloud/t2v_jobs/{job_id}.json").read_text())
          ids = [s["id"] for s in data["scenes"]]
          if only:
              ids = [i for i in ids if i == only]
          print(f"job_id={job_id}")
          print("matrix=" + json.dumps({"scene": ids}))
          PY

  scene:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: torch + diffusers (CPU)
        run: |-
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --quiet "diffusers>=0.32" "transformers>=4.49" accelerate safetensors \
            sentencepiece protobuf ftfy imageio imageio-ffmpeg huggingface_hub
          python3 -c "import torch, diffusers; print('torch', torch.__version__, 'diffusers', diffusers.__version__)"
          free -g; nproc

      - name: Generate this scene
        env:
          HF_HUB_DISABLE_XET: "1"
          OMP_NUM_THREADS: "4"
          MALLOC_ARENA_MAX: "2"
          TOKENIZERS_PARALLELISM: "false"
        run: |-
          set -euo pipefail
          JOB="${{ needs.prepare.outputs.job_id }}"
          SCENE="${{ matrix.scene }}"
          OUT="t2v_out/${JOB}_${SCENE}"
          mkdir -p "$OUT"
          python3 tools/cloud_t2v.py "cloud/t2v_jobs/$JOB.json" --scene "$SCENE" --out "$OUT" \
            2>&1 | tee "$OUT/gen.log"
          ls -lh "$OUT"
          ffmpeg -hide_banner -i "$OUT/${SCENE}.mp4" 2>&1 | tail -4

      - name: Publish this scene to its own branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          set -euo pipefail
          JOB="${{ needs.prepare.outputs.job_id }}"
          SCENE="${{ matrix.scene }}"
          OUT="$PWD/t2v_out/${JOB}_${SCENE}"
          BRANCH="t2v-${JOB}-${SCENE}"
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cp "$OUT/${SCENE}.mp4" /tmp/pub/
          python3 - "$JOB" "$SCENE" "$OUT" <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          job, scene, out = sys.argv[1], sys.argv[2], pathlib.Path(sys.argv[3])
          clip = out / f"{scene}.mp4"
          probe = subprocess.run(["ffmpeg", "-hide_banner", "-i", str(clip)],
                                 capture_output=True, text=True).stderr
          payload = {"job": job, "scene": scene, "file": clip.name,
                     "bytes": clip.stat().st_size,
                     "md5": hashlib.md5(clip.read_bytes()).hexdigest(),
                     "probe": [l for l in probe.splitlines() if "Stream" in l or "Duration" in l]}
          pathlib.Path("/tmp/pub/receipt.json").write_text(json.dumps(payload, indent=2))
          print(json.dumps(payload, indent=2))
          PY
          cd /tmp/pub
          git init -q -b pub
          git config user.name "Monarch Cloud"
          git config user.email "cloud@monarch.local"
          git add -A
          git commit -q -m "t2v: ${JOB} ${SCENE}"
          git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"
          git ls-remote --heads "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${BRANCH}"

      - name: Publish failure log (sandbox ke liye readable)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          set -uo pipefail
          JOB="${{ needs.prepare.outputs.job_id }}"
          SCENE="${{ matrix.scene }}"
          BRANCH="t2verr-${JOB}-${SCENE}"
          rm -rf /tmp/err && mkdir -p /tmp/err
          tail -c 30000 "$PWD/t2v_out/${JOB}_${SCENE}/gen.log" > /tmp/err/gen.log 2>/dev/null || echo "no log" > /tmp/err/gen.log
          free -g > /tmp/err/mem.txt 2>/dev/null || true
          df -h / > /tmp/err/disk.txt 2>/dev/null || true
          cd /tmp/err
          git init -q -b pub
          git config user.name "Monarch Cloud"
          git config user.email "cloud@monarch.local"
          git add -A
          git commit -q -m "t2v error: ${JOB} ${SCENE}"
          git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}" || echo "error branch push fail"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t2v-${{ matrix.scene }}
          path: t2v_out/**/*.mp4
          retention-days: 7
