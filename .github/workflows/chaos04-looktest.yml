name: CHAOS 04 3D look test

# Runs on GitHub's Ubuntu runners: root access means the Blender system libs can
# be installed, so the Monarch scene can actually render without the Colab box.
# CPU only — this is a look/motion gate at 360x640, not the 1080x1920 delivery.

on:
  push:
    branches: [arena/faa9119c-monarch-studio]
    paths:
      - ".github/workflows/chaos04-looktest.yml"
      - "workflows/current/payload/WF04-CHAOS04/chaos04/**"
      - "workflows/current/payload/WF04-CHAOS04/gpu/jobs/**"
  workflow_dispatch:

jobs:
  looktest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Blender runtime libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxi6 libxxf86vm1 libxfixes3 \
            libgl1 libegl1 libsm6 libice6 libxkbcommon0 libxrandr2 libxinerama1 \
            libgomp1 libosmesa6 ffmpeg

      - name: Python deps (bpy wheel + encoder)
        run: |
          python -m pip install --upgrade pip
          pip install "bpy==4.2.0" numpy imageio-ffmpeg
          python -c "import bpy, sys; print('bpy', bpy.app.version_string); sys.exit(0)"

      - name: Build scene (360x640 preview settings)
        working-directory: workflows/current/payload/WF04-CHAOS04
        run: |
          python chaos04/build.py -- --out build/chaos04.blend \
            --width 360 --height 640 --samples 8
          ls -l build

      - name: Render look-test frames
        working-directory: workflows/current/payload/WF04-CHAOS04
        env:
          SHOTS: "223,240,262,279,399,420,444,470,489,505,519,530,541,552,600,610,789,815,987,1010"
        run: |
          python chaos04/render.py -- --out render/look --samples 8 --start 1 --end 1332 \
            --skip-existing 0 --only "$SHOTS"
          ls render/look | head

      - name: Score + contact sheet + clip
        working-directory: workflows/current/payload/WF04-CHAOS04
        run: |
          pip install --quiet pillow
          python chaos04/score.py --out build/score_48k.wav
          python gpu/jobs/looktest_post.py
          ls -l build

      - uses: actions/upload-artifact@v4
        with:
          name: chaos04-looktest
          path: |
            workflows/current/payload/WF04-CHAOS04/build/looktest_sheet.jpg
            workflows/current/payload/WF04-CHAOS04/build/looktest_clip.mp4
            workflows/current/payload/WF04-CHAOS04/build/chaos04.manifest.json
            workflows/current/payload/WF04-CHAOS04/render/look/*.png
          if-no-files-found: warn
