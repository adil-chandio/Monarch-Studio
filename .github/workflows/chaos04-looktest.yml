name: CHAOS 04 3D look test

# Runs on GitHub's Ubuntu runners: root access means the Blender system libs can
# be installed, so the Monarch scene can actually render without the Colab box.
# CPU only — a look/motion gate at 360x640, not the 1080x1920 delivery.
# Results are committed back to the branch (this repo is public and the runner
# has no other channel out).

on:
  push:
    branches: [arena/faa9119c-monarch-studio]
    paths:
      - "workflows/current/payload/WF04-CHAOS04/gpu/jobs/run.flag"
  workflow_dispatch:
    inputs:
      mode:
        description: "diag = one frame per segment, look = full stills + motion run"
        default: diag
        type: choice
        options: [diag, look]

permissions:
  contents: write

jobs:
  looktest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Blender runtime libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxi6 libxxf86vm1 libxfixes3 \
            libgl1 libegl1 libsm6 libice6 libxkbcommon0 libxrandr2 libxinerama1 \
            libgomp1 libosmesa6 ffmpeg

      - name: Python deps (bpy wheel + encoder)
        run: |
          python -m pip install --upgrade pip
          pip install "bpy==4.2.0" numpy imageio-ffmpeg pillow
          python -c "import bpy, sys; print('bpy', bpy.app.version_string); sys.exit(0)"

      - name: Build scene (360x640 preview settings)
        working-directory: workflows/current/payload/WF04-CHAOS04
        run: |
          /usr/bin/time -f "BUILD %e s" python chaos04/build.py -- \
            --out build/chaos04.blend --width 360 --height 640 --samples 8
          ls -l build

      - name: Head study (is the v5 capture on the face?)
        working-directory: workflows/current/payload/WF04-CHAOS04
        run: |
          python gpu/jobs/headtest.py -- --blend build/chaos04.blend --out render/head \
            --samples 16
          ls -l render/head

      - name: Endcard check
        if: ${{ github.event.inputs.mode != 'diag' }}
        working-directory: workflows/current/payload/WF04-CHAOS04
        run: |
          python gpu/jobs/endcardtest.py -- build/chaos04.blend
          ls -l render/endcard

      - name: One frame per segment
        if: ${{ github.event.inputs.mode == 'diag' || github.event_name == 'push' }}
        working-directory: workflows/current/payload/WF04-CHAOS04
        run: |
          python gpu/jobs/diag.py -- "$PWD" --samples 8
          ls render/diag | head -40

      - name: Stills across the film
        if: ${{ github.event.inputs.mode != 'diag' }}
        working-directory: workflows/current/payload/WF04-CHAOS04
        env:
          SHOTS: "240,300,420,470,500,530,560,620,700,780,800,900,1000,1060,1100,1200,1220,1240,1275,1300,1332"
        run: |
          python chaos04/render.py -- --blend build/chaos04.blend --out render/look \
            --samples 8 --skip-existing 0 --only "$SHOTS"
          cp render/progress.jsonl build/progress_stills.jsonl || true

      - name: Contiguous motion run (shots 05-06, 114 frames = 3.8 s)
        if: ${{ github.event.inputs.mode != 'diag' }}
        working-directory: workflows/current/payload/WF04-CHAOS04
        run: |
          /usr/bin/time -f "MOTION %e s" python chaos04/render.py -- \
            --blend build/chaos04.blend --out render/motion --samples 8 \
            --start 223 --end 336
          cp render/progress.jsonl build/progress_motion.jsonl || true

      - name: Score, contact sheet, clip
        working-directory: workflows/current/payload/WF04-CHAOS04
        run: |
          python chaos04/score.py --out build/score_48k.wav
          python gpu/jobs/looktest_post.py
          ls -l build

      - name: Publish results into the branch
        if: always()
        run: |
          set -e
          WF=workflows/current/payload/WF04-CHAOS04
          OUT=$WF/output/looktest
          mkdir -p "$OUT"
          cp -v "$WF"/build/looktest_sheet.jpg "$OUT"/ 2>/dev/null || true
          cp -v "$WF"/build/looktest_clip.mp4 "$OUT"/ 2>/dev/null || true
          cp -v "$WF"/build/progress_*.jsonl "$OUT"/ 2>/dev/null || true
          cp -v "$WF"/build/chaos04.manifest.json "$OUT"/ 2>/dev/null || true
          mkdir -p "$OUT/frames" "$OUT/head" "$OUT/diag"
          cp -v "$WF"/render/diag/*.png "$WF"/render/diag/report.json "$OUT/diag"/ 2>/dev/null || true
          cp -v "$WF"/render/look/*.png "$OUT/frames"/ 2>/dev/null || true
          cp -v "$WF"/render/head/*.png "$OUT/head"/ 2>/dev/null || true
          mkdir -p "$OUT/endcard"
          cp -v "$WF"/render/endcard/*.png "$WF"/render/endcard/report.json "$OUT/endcard"/ 2>/dev/null || true
          du -sh "$OUT"
          cat > "$OUT/README.md" <<EOF
          # CHAOS 04 look test (run $GITHUB_RUN_ID)

          Rendered on GitHub's Ubuntu runner with the Blender 4.2 \`bpy\` wheel —
          CPU only, 360 × 640, 8 samples, denoised. Not the delivery master; this
          exists so the character, sets and motion can be reviewed without the GPU box.

          - \`looktest_sheet.jpg\` — stills across the film
          - \`looktest_clip.mp4\` — shots 05–06 contiguous, with the real score
          - \`progress_*.jsonl\` — per-frame seconds, so the full render's ETA is measured
          - \`frames/\` — the still PNGs
          - \`chaos04.manifest.json\` — segment map that produced this
          EOF
          git config user.name "chaos04-looktest"
          git config user.email "looktest@monarch.studio"
          git add -f "$OUT"
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -m "look test: frames, clip and timings from run $GITHUB_RUN_ID" || true
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin HEAD:${GITHUB_REF_NAME} && break || sleep 10
          done
