name: Kaggle film (backend)

# Owner ko kuch nahi karna: yeh workflow Kaggle par GPU chunks khud chalata hai (API se),
# clips download karta hai, master + launch kit GitHub ke CPU par banata hai, aur deliverable
# Release me daal deta hai. Phone band ho jaye tab bhi kaam chalta rehta hai.
#
# Ek dafa ka setup (owner): repo Settings > Secrets and variables > Actions me
#   KAGGLE_USERNAME  = Kaggle username
#   KAGGLE_KEY       = Kaggle API key (kaggle.json se)
# Uske baad: Actions > "Kaggle film (backend)" > Run workflow.

# Trigger: cloud/kaggle_jobs/*.json ka naya commit (agent isi tarah run shuru karta hai),
# ya workflow_dispatch (jab yeh file main par ho).
on:
  push:
    branches: [main, arena/3d8cfad7-monarch-studio]
    paths:
      - "cloud/kaggle_jobs/*.json"
      - "scripts/kaggle_chunks.sh"
      - "tools/make_kaggle_kernel.py"
      - "tools/kaggle_stick_film.py"
      - "tools/film_factory.py"
      - "tools/clip_film.py"
      - ".github/workflows/kaggle-film.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: kaggle-film
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      POLL_MAX: "150"
      SLUG_PREFIX: "monarch-s4"
      DIAG: "1"
      REPORT: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Job spec (cloud/kaggle_jobs)
        run: |
          SPEC=$(ls -t cloud/kaggle_jobs/*.json | head -1)
          echo "spec: $SPEC"
          python - "$SPEC" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          chunks = d["chunks"] if "chunks" in d else ["k01,k02,k03,k04", "k05,k06,k07,k08", "k09,k10,k11,k12"]
          print("CHUNKS=" + ";".join(chunks))
          print("TITLE=" + (d.get("title") or "Powerful Personality"))
          print("SPEC_USER=" + (d.get("user") or ""))
          print("FETCH=" + ";".join(d.get("fetch") or []))
          PY

      - name: Kaggle CLI (creds ke liye pehle)
        run: python -m pip install --disable-pip-version-check -q kaggle

      - name: Kaggle creds
        env:
          MONARCH: ${{ secrets.MONARCH }}
          USER_SECRET: ${{ secrets.KAGGLE_USERNAME }}
          KEY_SECRET: ${{ secrets.KAGGLE_KEY }}
        run: |
          # Teen shaklein chalti hain:
          #   1) MONARCH me naya API token (KGAT_...)  -> KAGGLE_API_TOKEN
          #   2) MONARCH me poora kaggle.json          -> username + key
          #   3) KAGGLE_USERNAME + KAGGLE_KEY          -> username + key
          python - <<'PY'
          import json, os, pathlib

          blob = (os.environ.get("MONARCH") or "").strip()
          user = (os.environ.get("USER_SECRET") or "").strip()
          key = (os.environ.get("KEY_SECRET") or "").strip()
          token = ""
          lines = []

          def mask(value):
              if value:
                  print(f"::add-mask::{value}", flush=True)

          if blob:
              if blob.startswith("{"):
                  try:
                      data = json.loads(blob)
                      user = user or str(data.get("username") or "").strip()
                      key = key or str(data.get("key") or "").strip()
                  except Exception:
                      print("MONARCH JSON jaisa hai par parse nahi hua")
              elif ":" in blob and not blob.startswith("KGAT"):
                  left, right = blob.split(":", 1)
                  user = user or left.strip()
                  key = key or right.strip()
              else:
                  token = blob

          mask(key)
          mask(token)
          if token:
              lines.append("KAGGLE_API_TOKEN=" + token)
              os.environ["KAGGLE_API_TOKEN"] = token
          if key:
              os.environ["KAGGLE_KEY"] = key
              lines.append("KAGGLE_KEY=" + key)

          print(f"::notice::secret shape — length={len(blob)} kgat={blob.startswith('KGAT')} "
                f"json={blob.startswith('{')} colon={':' in blob} "
                f"user_from_secret={bool(os.environ.get('USER_SECRET'))}")

          if token and not user:
              try:
                  from kaggle.api.kaggle_api_extended import KaggleApi
                  api = KaggleApi(); api.authenticate()
                  user = api.get_config_value("username") or ""
                  print("token se username mila:", user)
              except Exception as exc:
                  print(f"::warning::token introspect fail: {type(exc).__name__}: {str(exc)[:200]}")

          if user:
              lines.append("KAGGLE_USERNAME=" + user)
              print("mode:", "api-token" if token else "username+key", "| user:", user)
          if token or (user and key):
              lines.append("HAVE_SECRETS=1")
          else:
              print("::warning::Kaggle creds samajh nahi aaye — is run me DRY RUN hoga.")
              lines.append("HAVE_SECRETS=0")

          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a") as fh:
              fh.write("\n".join(lines) + "\n")
          PY
          if grep -q "^HAVE_SECRETS=1" "$GITHUB_ENV"; then
            echo "Kaggle creds ready — asli GPU render hoga"
          else
            echo "::warning::Secret ki shakl samajh nahi aayi. MONARCH me Kaggle ka naya API token (KGAT_...) ya poora kaggle.json paste karo."
          fi

      - name: Tools (ffmpeg + kaggle + deps)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -q numpy pillow imageio-ffmpeg

      - name: Kaggle chunks (GPU)
        if: env.HAVE_SECRETS == '1'
        run: bash scripts/kaggle_chunks.sh "$CHUNKS" clips

      - name: Dry run clips (secrets nahi — CPU pipeline check)
        if: env.HAVE_SECRETS != '1'
        run: |
          python tools/kaggle_stick_film.py --selftest --only k01,k06,k12 --out /tmp/dry
          mkdir -p clips && cp /tmp/dry/clips/k*.mp4 clips/
          echo "::warning::DRY RUN — yeh clips keyframes ke stills hain (asli render nahi). Secrets add karne ke baad wahi run asli GPU render karega."

      - name: Master + launch kit (CPU)
        run: |
          mkdir -p clips deliver
          python tools/kaggle_stick_film.py --assemble-only \
            --out clips --final deliver --title "${TITLE:-Powerful Personality}"

      - name: Deliverable check
        run: |
          test -s deliver/monarch_stick_36s.mp4
          test -s deliver/kit/cover.jpg
          # teaser 2+ scenes par banta hai — adhoora run is par fail nahi hona chahiye
          test -s deliver/kit/teaser_11s.mp4 || echo "::warning::teaser nahi bana (kam scenes)"
          du -sh deliver deliver/kit
          {
            echo "## Film ready"
            echo ""
            echo "- mode: $([ "$HAVE_SECRETS" = "1" ] && echo 'GPU render (Kaggle)' || echo 'DRY RUN — stills')"
            echo "- master: monarch_stick_36s.mp4 ($(du -h deliver/monarch_stick_36s.mp4 | cut -f1))"
            echo "- scenes: $(find clips -name 'k*.mp4' -size +20k | wc -l | tr -d ' ')"
            echo "- kit: $(ls deliver/kit | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deliverable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monarch-film-${{ github.run_number }}
          path: |
            deliver/**
            clips/**
          retention-days: 14

      - name: Publish delivery branch (agent ke liye)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d deliver ] || [ -z "$(ls -A deliver 2>/dev/null)" ]; then
            echo "::warning::deliver khali — publish skip"
            exit 0
          fi
          set -o pipefail
          out=$(python tools/publish_delivery.py --dir deliver --branch deliveries 2>&1) || rc=$?
          echo "$out" | tail -25
          if [ "${rc:-0}" -ne 0 ]; then
            echo "::error::publish fail: $(echo "$out" | tail -3 | tr '\n' ' ' | cut -c1-300)"
            exit 1
          fi

      - name: Release (owner ka download link)
        if: env.HAVE_SECRETS == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="film-r${{ github.run_number }}"
          gh release create "$tag" \
            deliver/monarch_stick_36s.mp4 deliver/kit/*.mp4 deliver/kit/*.jpg \
            deliver/kit/*.srt deliver/kit/*.png deliver/kit/*.md \
            --title "Monarch film — run ${{ github.run_number }}" \
            --notes "Master 36s 9:16 + launch kit (teaser, cover, subtitles, contact sheet, kit.md)." \
            || gh release upload "$tag" deliver/monarch_stick_36s.mp4 --clobber
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$tag"
