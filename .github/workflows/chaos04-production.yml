name: CHAOS 04 production 1080x1920

# 16 parallel chunks: each runner renders its frame range at 1080x1920, encodes a
# crf-12 intermediate, publishes a small timing file so the run can be measured
# from git alone, and hands the chunk to finalize. finalize grades, adds the
# measured strobe grid and our score, verifies the file and commits output/final.

on:
  push:
    paths:
      - "workflows/current/payload/WF04-CHAOS04/gpu/jobs/production.flag"
  workflow_dispatch:
    inputs:
      samples:
        description: "cycles samples"
        default: "6"

permissions:
  contents: write

env:
  SAMPLES: "6"
  WF: workflows/current/payload/WF04-CHAOS04

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include:
          - { id: 0,  start: 1,    end: 84 }
          - { id: 1,  start: 85,   end: 168 }
          - { id: 2,  start: 169,  end: 252 }
          - { id: 3,  start: 253,  end: 336 }
          - { id: 4,  start: 337,  end: 420 }
          - { id: 5,  start: 421,  end: 504 }
          - { id: 6,  start: 505,  end: 588 }
          - { id: 7,  start: 589,  end: 672 }
          - { id: 8,  start: 673,  end: 756 }
          - { id: 9,  start: 757,  end: 840 }
          - { id: 10, start: 841,  end: 924 }
          - { id: 11, start: 925,  end: 1008 }
          - { id: 12, start: 1009, end: 1092 }
          - { id: 13, start: 1093, end: 1176 }
          - { id: 14, start: 1177, end: 1260 }
          - { id: 15, start: 1261, end: 1332 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxi6 libxxf86vm1 libxfixes3 \
            libgl1 libegl1 libsm6 libice6 libxkbcommon0 libxrandr2 libxinerama1 libgomp1
          nproc; df -h / | tail -1
      - name: deps
        run: |
          python -m pip install --upgrade pip -q
          pip install -q "bpy==4.2.0" numpy imageio-ffmpeg
      - name: build 1080x1920
        working-directory: ${{ env.WF }}
        run: |
          python chaos04/build.py -- --out build/main.blend --width 1080 --height 1920 \
            --samples ${{ env.SAMPLES }} --fast
      - name: render chunk ${{ matrix.id }}
        working-directory: ${{ env.WF }}
        run: |
          START=$(date +%s)
          python chaos04/render.py -- \
            --blend build/main.blend --out render/frames --samples ${{ env.SAMPLES }} \
            --start ${{ matrix.start }} --end ${{ matrix.end }}
          DONE=$(date +%s)
          N=$(ls render/frames | wc -l)
          EL=$((DONE - START))
          python - "$N" "$EL" "${{ matrix.id }}" "${{ matrix.start }}" "${{ matrix.end }}" <<'PY'
          import json, sys, pathlib
          n, elapsed, cid, s, e = int(sys.argv[1]), int(sys.argv[2]), sys.argv[3], int(sys.argv[4]), int(sys.argv[5])
          want = e - s + 1
          doc = {"chunk": cid, "frames": n, "expected": want, "seconds": elapsed,
                 "sec_per_frame": round(elapsed / max(1, n), 2)}
          out = pathlib.Path("output/render_status"); out.mkdir(parents=True, exist_ok=True)
          (out / ("chunk_%02d.json" % int(cid))).write_text(json.dumps(doc, indent=1))
          print(json.dumps(doc), flush=True)
          PY
      - name: encode chunk
        working-directory: ${{ env.WF }}
        run: |
          python - <<'PY'
          import imageio_ffmpeg, subprocess, pathlib
          ff = imageio_ffmpeg.get_ffmpeg_exe()
          out = pathlib.Path("render/chunks"); out.mkdir(parents=True, exist_ok=True)
          dst = out / ("chunk_%03d.mp4" % ${{ matrix.id }})
          subprocess.run([ff, "-y", "-hide_banner", "-loglevel", "error",
                          "-framerate", "30", "-start_number", "${{ matrix.start }}",
                          "-i", "render/frames/%04d.png",
                          "-frames:v", str(${{ matrix.end }} - ${{ matrix.start }} + 1),
                          "-c:v", "libx264", "-preset", "slow", "-crf", "12",
                          "-pix_fmt", "yuv420p",
                          "-x264-params", "keyint=30:min-keyint=1:scenecut=0",
                          str(dst)], check=True)
          print(dst, dst.stat().st_size)
          PY
      - name: report timing
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          git config user.name chaos04-render; git config user.email render@monarch.studio
          git add -f "${{ env.WF }}/output/render_status" || true
          for i in 1 2 3; do
            git commit -m "render status: chunk ${{ matrix.id }}" || true
            git pull --rebase -q origin ${GITHUB_REF_NAME} || true
            if git push -q origin HEAD:${GITHUB_REF_NAME}; then break; fi
            sleep 5
          done
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.id }}
          path: ${{ env.WF }}/render/chunks/chunk_*.mp4
          if-no-files-found: error
          retention-days: 14

  finalize:
    needs: render
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          merge-multiple: true
          path: ${{ env.WF }}/render/chunks
      - name: deps
        run: |
          sudo apt-get install -y -qq ffmpeg
          pip install -q numpy imageio-ffmpeg
      - name: chunks we got
        run: ls -l "${{ env.WF }}/render/chunks"
      - name: score
        working-directory: ${{ env.WF }}
        run: python chaos04/score.py --out build/score_48k.wav
      - name: finalize + verify
        working-directory: ${{ env.WF }}
        run: |
          python gpu/jobs/finalize.py --chunks render/chunks \
            --audio build/score_48k.wav \
            --out build/CHAOS04_MASTER_1080x1920.mp4 \
            --preview build/CHAOS04_PREVIEW_540x960.mp4
          ls -l build/*.mp4 build/*.report.json
      - name: publish
        run: |
          set -e
          OUT=${{ env.WF }}/output/final
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp -v "${{ env.WF }}"/build/CHAOS04_MASTER_1080x1920.mp4 "$OUT"/ || true
          cp -v "${{ env.WF }}"/build/CHAOS04_PREVIEW_540x960.mp4 "$OUT"/ || true
          cp -v "${{ env.WF }}"/build/*.report.json "$OUT"/ || true
          cp -v "${{ env.WF }}"/build/score_48k.wav "$OUT"/ || true
          du -sh "$OUT"
          git config user.name chaos04-master; git config user.email master@monarch.studio
          git add -f "$OUT"
          for i in 1 2 3; do
            git commit -m "master: 1080x1920, run $GITHUB_RUN_ID" || true
            git pull --rebase -q origin ${GITHUB_REF_NAME} || true
            if git push -q origin HEAD:${GITHUB_REF_NAME}; then break; fi
            sleep 10
          done
