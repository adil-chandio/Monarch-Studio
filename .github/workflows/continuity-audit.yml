name: Continuity audit

on:
  push:
  pull_request:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository validation
        run: python tools/studio.py validate
      - name: Continuity integrity and freshness
        run: python tools/continuity.py audit --max-age-minutes 70
      - name: Unit tests
        run: python -m unittest discover -s tests -v
